<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Helichrysum WebUI · 问题列表 4 种设计方向</title>
<!--
  Helichrysum WebUI 问题列表 · 4 个结构级设计方向（单文件自包含评审稿）
  · 方向 A：侧栏应用式（VS Code / Figma 风）—— 图标栏 + 功能侧栏 + 主内容区，无顶部导航
  · 方向 B：顶部导航 + 杂志式信息流（Linear / Apple 风）—— 通栏导航 + 居中大留白卡片流
  · 方向 C：全宽数据表格（现代数据工具风）—— 紧凑工具栏 + 可展开行的高密度表格
  · 方向 D：仪表板混合式（Dashboard 风）—— KPI 统计带 + 可折叠筛选面板 + 半卡片半列表
  · 四个方向共享同一份问题列表数据（16 组 / 统计 / 筛选 / 批量操作 / 下钻详情），结构互不相同的渲染器输出
-->
<style>
/* ============================================================
   0. 基础重置与共享 token（语义色为数据含义，四方向一致）
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.55; color: #292524; background: #e8e8e8;
  min-width: 1280px;
}
button { font-family: inherit; font-size: inherit; line-height: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font-family: inherit; font-size: inherit; color: inherit; }
input[type="checkbox"] { cursor: pointer; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; vertical-align: -3px; }
.icon-small { width: 13px; height: 13px; vertical-align: -2px; }
.monospace { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; }
.numeric { font-variant-numeric: tabular-nums; }

/* 关系类型语义色 */
.relation-structural-sibling { --relation-color: #4f46e5; --relation-background: #eef2ff; }
.relation-versioned { --relation-color: #16a34a; --relation-background: #f0fdf4; }
.relation-exact-duplicate { --relation-color: #2563eb; --relation-background: #eff6ff; }
.relation-near-duplicate { --relation-color: #0e7490; --relation-background: #ecfeff; }
.relation-partial-overlap { --relation-color: #ea580c; --relation-background: #fff7ed; }
.relation-renamed { --relation-color: #52627a; --relation-background: #f1f5f9; }
.relation-moved { --relation-color: #64748b; --relation-background: #f4f6f8; }
.relation-archive-pair { --relation-color: #9333ea; --relation-background: #faf5ff; }
.relation-link-reference { --relation-color: #475569; --relation-background: #f1f5f9; }
.relation-out-of-scope { --relation-color: #b45309; --relation-background: #fef3c7; }
.relation-broken { --relation-color: #dc2626; --relation-background: #fef2f2; }
.relation-circular { --relation-color: #9f1239; --relation-background: #ffe4e6; }

/* Resolution 语义色 */
.resolution-equality { --resolution-color: #15803d; --resolution-background: #dcfce7; --resolution-border: #bbf7d0; }
.resolution-compatibility { --resolution-color: #0369a1; --resolution-background: #e0f2fe; --resolution-border: #bae6fd; }
.resolution-conflict { --resolution-color: #dc2626; --resolution-background: #fee2e2; --resolution-border: #fecaca; }
.resolution-integrity-suspected { --resolution-color: #7f1d1d; --resolution-background: #f7dcdc; --resolution-border: #efb9b9; }

/* 建议 chip 语义色 */
.suggestion-keep { color: #15803d; background: #dcfce7; }
.suggestion-trash { color: #be123c; background: #ffe4e6; }
.suggestion-manual { color: #b45309; background: #fef3c7; }
.suggestion-neutral { color: #57534e; background: #f1f0ed; }
.suggestion-integrity { color: #7f1d1d; background: #f7dcdc; }

/* ============================================================
   1. 方向切换器（评审稿自身的外壳，不属于任何设计方向）
   ============================================================ */
.direction-switcher {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 56px;
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: #1c1917; color: #e7e5e4;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
}
.switcher-brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
.switcher-brand svg { width: 18px; height: 18px; color: #f59e0b; }
.switcher-label { font-size: 11px; color: #a8a29e; white-space: nowrap; }
.switcher-buttons { display: flex; gap: 6px; margin: 0 auto; }
.switcher-button {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 8px; font-size: 12.5px; color: #d6d3d1;
  border: 1px solid transparent; transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.switcher-button:hover { background: #292524; color: #fff; }
.switcher-button.active { background: #f59e0b; color: #1c1917; font-weight: 700; }
.switcher-key {
  width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; background: rgba(255, 255, 255, 0.14);
}
.switcher-button.active .switcher-key { background: rgba(0, 0, 0, 0.16); }
.switcher-note { font-size: 11px; color: #78716c; white-space: nowrap; }

#design-root { padding-top: 56px; }
#design-root > .direction-stage { display: none; }
#design-root > .direction-stage.active { display: block; animation: stageFadeIn 0.25s ease; }
@keyframes stageFadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ============================================================
   2. 共享内容组件的基础形态（各方向在此基础上重写骨架）
   ============================================================ */
.relation-badge {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--relation-color); background: var(--relation-background);
}
.relation-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.relation-code { font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 400; opacity: 0.72; }
.resolution-badge {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--resolution-color); background: var(--resolution-background);
}
.suggestion-chip { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.title-separator { opacity: 0.45; font-weight: 400; }
.keep-candidate-star { color: #d97706; width: 13px; height: 13px; fill: currentColor; stroke: none; }
.member-more-button { width: 26px; height: 26px; border-radius: 6px; color: #a8a29e; display: grid; place-items: center; letter-spacing: 1px; font-weight: 700; }
.analysis-layer-chips { display: flex; gap: 5px; margin-top: 10px; }

/* 下钻详情的语义结构（四方向共用 DOM，各自换肤） */
.issue-detail.collapsed { display: none; }
.detail-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
.detail-panel-heading { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
.evidence-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.evidence-item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; }
.evidence-marker { color: #15803d; flex: none; margin-top: 2px; }
.evidence-marker.evidence-miss { color: #dc2626; }
.layer-chip { font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; border: 1px solid; font-variant-numeric: tabular-nums; }
.process-chain-panel { display: flex; flex-direction: column; }
.process-chain-step { display: flex; align-items: flex-start; gap: 9px; padding: 5px 0; }
.process-chain-dot { width: 20px; height: 20px; border-radius: 50%; flex: none; margin-top: 1px; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid; }
.process-chain-name { font-size: 12.5px; font-weight: 650; }
.process-chain-meta { font-size: 11.5px; }
.chain-dependency-tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.process-chain-note { font-size: 11.5px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed; }
.conflict-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.conflict-party-label { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 4px; }
.conflict-summary { font-size: 12.5px; line-height: 1.6; }
.manual-decision-ribbon { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 12px; }

/* ============================================================
   3. 方向 A：侧栏应用式（VS Code / Figma 风）
   ============================================================ */
.direction-a { background: #f8fafc; min-height: 100vh; }
.a-app { display: grid; grid-template-columns: 48px 240px minmax(0, 1fr); min-height: calc(100vh - 56px); }

/* 48px 图标栏 */
.a-icon-rail { background: #0f172a; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; position: sticky; top: 56px; height: calc(100vh - 56px); z-index: 60; }
.a-rail-brand { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 10px; background: linear-gradient(145deg, #f59e0b, #d97706); }
.a-rail-brand svg { width: 18px; height: 18px; color: #fff; }
.a-rail-item { position: relative; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #64748b; transition: color 0.15s ease, background-color 0.15s ease; }
.a-rail-item:hover { color: #e2e8f0; background: #1e293b; }
.a-rail-item.active { color: #fbbf24; background: #1e293b; }
.a-rail-item.active::before { content: ""; position: absolute; left: -6px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: #f59e0b; }
.a-rail-item .icon { width: 18px; height: 18px; }
.a-rail-flyout {
  position: absolute; left: 44px; top: 50%; transform: translateY(-50%) translateX(-4px);
  background: #0f172a; color: #e2e8f0; font-size: 12px; font-weight: 600; white-space: nowrap;
  border: 1px solid #334155; border-radius: 6px; padding: 5px 10px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease; z-index: 70;
}
.a-rail-item:hover .a-rail-flyout { opacity: 1; transform: translateY(-50%) translateX(0); }
.a-rail-footer { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }

/* 240px 功能侧栏 */
.a-sidebar { background: #1e293b; color: #cbd5e1; padding: 16px 12px 20px; overflow-y: auto; position: sticky; top: 56px; height: calc(100vh - 56px); }
.a-sidebar-module { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #64748b; padding: 0 8px 10px; }
.a-sidebar-title { font-size: 15px; font-weight: 700; color: #f1f5f9; padding: 0 8px 12px; display: flex; align-items: center; justify-content: space-between; }
.a-sidebar-title .numeric { font-size: 11px; font-weight: 600; color: #94a3b8; background: #0f172a; border-radius: 999px; padding: 2px 8px; }
.a-side-section { margin-bottom: 18px; }
.a-side-heading { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; color: #64748b; padding: 0 8px 7px; }
.a-type-item { position: relative; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #94a3b8; padding: 5px 8px; border-radius: 6px; transition: background-color 0.15s ease, color 0.15s ease; }
.a-type-item:hover { background: #273549; color: #e2e8f0; }
.a-type-item.active { background: #273549; color: #f8fafc; font-weight: 600; }
.a-type-item.active::before { content: ""; position: absolute; left: -12px; top: 4px; bottom: 4px; width: 3px; background: #f59e0b; border-radius: 2px; }
.a-type-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.a-type-count { margin-left: auto; font-size: 11px; color: #64748b; font-variant-numeric: tabular-nums; }
.a-type-item.active .a-type-count { color: #fbbf24; }
.a-filter-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.a-filter-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; color: #64748b; }
.a-filter-input, .a-filter-select {
  font-size: 12px; padding: 6px 9px; color: #e2e8f0;
  background: #0f172a; border: 1px solid #334155; border-radius: 6px; width: 100%;
}
.a-filter-input:focus, .a-filter-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25); }
.a-filter-range { display: flex; align-items: center; gap: 5px; }
.a-filter-range .a-filter-input { min-width: 0; flex: 1; }
.a-filter-separator { font-size: 11px; color: #64748b; flex: none; }
.a-quick-chip { display: block; width: 100%; text-align: left; font-size: 12px; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; padding: 5px 9px; margin-bottom: 6px; transition: all 0.15s ease; }
.a-quick-chip:hover { border-color: #f59e0b; color: #fbbf24; }
.a-quick-chip.selected { background: rgba(245, 158, 11, 0.14); border-color: #f59e0b; color: #fbbf24; font-weight: 600; }
.a-side-reset { font-size: 11.5px; color: #64748b; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 6px; }
.a-side-reset:hover { color: #e2e8f0; background: #273549; }

/* 主内容区 */
.a-main { padding: 22px 26px 48px; min-width: 0; }
.a-view-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.a-view-title { font-size: 20px; font-weight: 700; color: #0f172a; }
.a-view-subtitle { font-size: 12.5px; color: #64748b; margin-top: 3px; }
.a-header-actions { display: flex; gap: 8px; flex: none; }
.a-button { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 7px 13px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #334155; transition: all 0.15s ease; }
.a-button:hover { background: #f1f5f9; border-color: #94a3b8; }
.a-button-primary { border: none; background: #3b82f6; color: #fff; font-weight: 600; }
.a-button-primary:hover { background: #2563eb; }
.a-stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.a-stat-tile { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; }
.a-stat-value { font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; color: #0f172a; }
.a-stat-unit { font-size: 12px; font-weight: 500; color: #64748b; margin-left: 4px; }
.a-stat-label { font-size: 12px; color: #64748b; margin-top: 1px; }
.a-stat-tile.accent .a-stat-value { color: #3b82f6; }
.a-stat-tile.warning .a-stat-value { color: #dc2626; }

.a-batch-bar {
  position: sticky; top: 66px; z-index: 50;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; margin-bottom: 14px;
  background: #0f172a; color: #e2e8f0; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.25);
}
.a-selected-count { font-size: 12px; font-weight: 700; color: #60a5fa; background: rgba(59, 130, 246, 0.16); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 999px; padding: 3px 10px; margin-right: 2px; }
.a-batch-button { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 4px 10px; transition: all 0.15s ease; }
.a-batch-button:hover { border-color: #60a5fa; color: #fff; background: rgba(59, 130, 246, 0.14); }
.a-batch-button .icon { width: 13px; height: 13px; }
.a-batch-note { font-size: 11.5px; color: #64748b; margin-left: auto; }

.a-group-list { display: flex; flex-direction: column; gap: 10px; }
.a-group { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
.a-group:hover { border-color: #cbd5e1; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05); }
.a-group.expanded { border-color: #93c5fd; }
.a-group-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 14px; cursor: pointer; user-select: none; }
.a-group-caret { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; color: #94a3b8; transition: transform 0.18s ease, background-color 0.15s ease; flex: none; }
.a-group-caret .icon { width: 14px; height: 14px; }
.a-group.expanded .a-group-caret { transform: rotate(90deg); }
.a-group-header:hover .a-group-caret { background: #eff6ff; color: #3b82f6; }
.a-group .relation-badge { border-radius: 5px; padding: 2px 8px 2px 7px; }
.a-group-title { font-size: 13.5px; font-weight: 650; color: #0f172a; display: flex; align-items: center; gap: 7px; min-width: 170px; }
.a-group .resolution-badge { border-radius: 5px; padding: 2px 9px; border: 1px solid var(--resolution-border); }
.a-confidence { display: flex; align-items: center; gap: 6px; flex: none; }
.a-confidence-track { width: 46px; height: 4px; border-radius: 3px; background: #e2e8f0; overflow: hidden; }
.a-confidence-fill { height: 100%; border-radius: 3px; background: #3b82f6; }
.a-confidence-value { font-size: 11.5px; font-weight: 700; color: #475569; font-variant-numeric: tabular-nums; }
.a-confidence-note { font-size: 11.5px; color: #94a3b8; }
.a-group-meta { margin-left: auto; font-size: 11.5px; color: #94a3b8; font-variant-numeric: tabular-nums; white-space: nowrap; }
.a-recommend-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #1d4ed8; background: #eff6ff; border: 1px dashed #3b82f6; border-radius: 999px; padding: 2px 9px; }
.a-recommend-tag .icon { width: 11px; height: 11px; }

.a-group-body { display: none; border-top: 1px solid #e2e8f0; }
.a-group.expanded .a-group-body { display: block; animation: aBodyReveal 0.2s ease; }
@keyframes aBodyReveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.a-member-header, .a-member { display: grid; grid-template-columns: 26px minmax(0, 1fr) 84px 132px 128px 96px 34px; gap: 10px; align-items: center; padding-left: 14px; padding-right: 14px; }
.a-member-header { padding-top: 6px; padding-bottom: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; color: #94a3b8; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
.a-member { padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; transition: background-color 0.15s ease; }
.a-member:hover { background: #f8fafc; }
.a-member-checkbox { width: 14px; height: 14px; accent-color: #3b82f6; }
.a-path-cell { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.a-path { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #1e293b; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.a-path .icon { width: 14px; height: 14px; color: #94a3b8; }
.a-path-detail { font-size: 11px; color: #94a3b8; }
.a-cell-text { font-size: 12px; color: #475569; font-variant-numeric: tabular-nums; white-space: nowrap; }
.a-member-more:hover { background: #e2e8f0; color: #0f172a; }

.a-detail-toggle { display: inline-flex; align-items: center; gap: 6px; margin: 9px 14px; font-size: 12px; font-weight: 600; color: #1d4ed8; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 999px; padding: 4px 12px; transition: background-color 0.15s ease; }
.a-detail-toggle:hover { background: #dbeafe; }
.a-detail-toggle .toggle-caret { display: inline-flex; transition: transform 0.18s ease; }
.a-detail-toggle .toggle-caret.rotated { transform: rotate(90deg); }
.a-detail { margin: 0 14px 12px; padding: 13px 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
.a-detail .detail-panel-heading { color: #475569; }
.a-detail .evidence-item-text { color: #475569; }
.a-detail .evidence-item-text b { color: #0f172a; font-weight: 600; }
.a-detail .layer-chip { color: #94a3b8; border-color: #cbd5e1; }
.a-detail .layer-chip.hit { color: #fff; background: #334155; border-color: #334155; }
.a-detail .process-chain-dot { border-color: #cbd5e1; color: #94a3b8; background: #fff; }
.a-detail .process-chain-step.state-done .process-chain-dot { background: #dcfce7; border-color: #15803d; color: #15803d; }
.a-detail .process-chain-step.state-active .process-chain-dot { background: #3b82f6; border-color: #3b82f6; color: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
.a-detail .process-chain-step.state-pending .process-chain-name { color: #94a3b8; font-weight: 500; }
.a-detail .process-chain-meta { color: #64748b; }

/* ============================================================
   共享渲染助手：徽章 / 置信度 / 成员行 / 下钻详情
   ============================================================ */
function iconUse(iconId, extraClass) {
  return '<svg class="icon' + (extraClass ? " " + extraClass : "") + '"><use href="#' + iconId + '"/></svg>';
}

function renderRelationBadge(group) {
  return '<span class="relation-badge relation-' + group.relationClass + '" title="' + group.relationTitle + '">' +
    group.relationName + ' <span class="relation-code">' + group.relationCode + '</span></span>';
}

function renderResolutionBadge(group) {
  return '<span class="resolution-badge resolution-' + group.resolutionClass + '" title="' + (group.resolutionTitle || "") + '">' + group.resolutionText + '</span>';
}

function renderRecommendTag(group, tagClass) {
  if (!group.recommend) return "";
  return '<span class="' + tagClass + '">' + iconUse("icon-star") + group.recommend + '</span>';
}

/* 置信度：条形（A / B 方向使用） */
function renderConfidenceBar(group, classes) {
  if (group.confidence === null) return '<span class="' + classes.note + '">' + group.confidenceNote + '</span>';
  return '<div class="' + classes.wrap + '">' +
    '<div class="' + classes.track + '"><div class="' + classes.fill + '" style="width: ' + group.confidence + '%;"></div></div>' +
    '<span class="' + classes.value + '">' + group.confidence + '%</span></div>';
}

/* 置信度：环形（D 方向使用，半径 15.9155 → 周长 100） */
function renderConfidenceDonut(group) {
  if (group.confidence === null) return '<span class="d-confidence-note">' + group.confidenceNote + '</span>';
  return '<div class="d-confidence-donut" title="判定置信度 ' + group.confidence + '%">' +
    '<svg class="d-donut" viewBox="0 0 36 36">' +
    '<circle class="d-donut-track" cx="18" cy="18" r="15.9155"/>' +
    '<circle class="d-donut-fill" cx="18" cy="18" r="15.9155" stroke-dasharray="' + group.confidence + ' ' + (100 - group.confidence) + '"/>' +
    '</svg><span class="d-donut-value">' + group.confidence + '%</span></div>';
}

function renderMemberPath(member, pathClass, detailClass) {
  var star = member.star ? '<svg class="icon keep-candidate-star" title="保留候选"><use href="#icon-star"/></svg>' : "";
  return '<div class="' + pathClass.cell + '">' +
    '<div class="' + pathClass.path + '">' + iconUse(member.icon) + star + member.path + '</div>' +
    '<div class="' + detailClass + '">' + member.detail + '</div></div>';
}

function renderMemberExtra(member, textClass) {
  return '<span class="' + textClass + (member.extraMonospace ? " monospace" : "") + '">' + member.extra + '</span>';
}

/* 下钻详情：统一语义 DOM，各方向 CSS 换肤 */
function renderDetail(detailKey, detailClass) {
  var detail = DETAILS[detailKey];
  if (!detail) return "";
  if (detail.kind === "conflict") {
    var partiesHtml = detail.parties.map(function (party) {
      return '<div class="conflict-party"><div class="conflict-party-label">' + party.label + '</div>' +
        '<div class="monospace">' + party.path + '</div>' +
        '<div class="conflict-party-meta">' + party.meta + '</div></div>';
    }).join("");
    return '<div class="' + detailClass + '">' +
      '<div class="conflict-parties">' + partiesHtml + '</div>' +
      '<div class="conflict-summary">' + detail.summaryHtml + '</div>' +
      '<span class="manual-decision-ribbon">' + iconUse("icon-alert-triangle", "icon-small") + detail.ribbon + '</span></div>';
  }
  var evidenceHtml = detail.evidence.map(function (item) {
    return '<li class="evidence-item">' +
      '<svg class="icon icon-small evidence-marker' + (item.positive ? "" : " evidence-miss") + '"><use href="#' + (item.positive ? "icon-check" : "icon-x") + '"/></svg>' +
      '<span class="evidence-item-text">' + item.html + '</span></li>';
  }).join("");
  var chipsHtml = detail.layerChips
    ? '<div class="analysis-layer-chips" title="分层渐进分析命中层（F-Layered-1）">' +
      detail.layerChips.map(function (chip) { return '<span class="layer-chip' + (chip.hit ? " hit" : "") + '">' + chip.label + '</span>'; }).join("") + '</div>'
    : "";
  var rightHtml;
  if (detail.chain) {
    rightHtml = '<div class="process-chain-panel">' + detail.chain.map(function (step, index) {
      var dotText = step.state === "done" ? "✓" : String(index + 1);
      var dependency = step.dependency ? '<span class="chain-dependency-tag">' + step.dependency + '</span>' : "";
      return '<div class="process-chain-step state-' + step.state + '"><span class="process-chain-dot">' + dotText + '</span>' +
        '<div><div class="process-chain-name">' + step.name + dependency + '</div>' +
        '<div class="process-chain-meta">' + step.meta + '</div></div></div>';
    }).join("") + '</div>' +
    (detail.chainNote ? '<div class="process-chain-note">' + detail.chainNote + '</div>' : "");
  } else {
    rightHtml = '<div class="conflict-summary">' + detail.constraintHtml + '</div>';
  }
  return '<div class="' + detailClass + '"><div class="detail-grid">' +
    '<div><div class="detail-panel-heading">' + detail.leftHeading + '</div><ul class="evidence-list">' + evidenceHtml + '</ul>' + chipsHtml + '</div>' +
    '<div><div class="detail-panel-heading">' + detail.rightHeading + '</div>' + rightHtml + '</div>' +
    '</div></div>';
}

/* 下钻开关按钮（label 依据展开状态切换） */
function renderDetailToggle(group, toggleClass, initiallyOpen) {
  var label = initiallyOpen ? group.detailOpenLabel : group.detailClosedLabel;
  return '<button type="button" class="' + toggleClass + '" data-detail-toggle="' + group.anchor + '" ' +
    'data-open-label="' + group.detailOpenLabel + '" data-closed-label="' + group.detailClosedLabel + '">' +
    '<span class="toggle-label">' + label + '</span>' +
    '<span class="toggle-caret' + (initiallyOpen ? " rotated" : "") + '">' + iconUse("icon-chevron-right", "icon-small") + '</span></button>';
}

function renderTypeNavigation(itemClass, dotClass, countClass) {
  return TYPE_NAVIGATION.map(function (item) {
    return '<a class="' + itemClass + (item.active ? " active" : "") + '" href="javascript:void(0)">' +
      '<span class="' + dotClass + '" style="background: ' + item.color + ';"></span>' + item.name +
      '<span class="' + countClass + '">' + item.count + '</span></a>';
  }).join("");
}

function renderFilterTypeOptions() {
  return FILTER_TYPE_OPTIONS.map(function (option) { return '<option>' + option + '</option>'; }).join("");

function renderQuickChips(chipClass) {

          renderQuickChips("d-chip") + '<button type="button" class="d-reset">' + iconUse("icon-filter") + '重置筛选</button></div>' +
      '</div></aside>';

  var groups = ISSUE_GROUPS.map(function (group, groupIndex) {
    var memberHeader = '<div class="d-member-header"><span></span><span>' + group.columns.join('</span><span>') + '</span><span></span></div>';
    var members = group.members.map(function (member) {
      return '<div class="d-member">' +
        '<input type="checkbox" class="d-member-checkbox"' + (member.checked ? " checked" : "") + '>' +
        renderMemberPath(member, { cell: "d-path-cell", path: "d-path" }, "d-path-detail") +
        '<span class="d-cell-text">' + member.size + '</span>' +
        '<span class="d-cell-text">' + member.mtime + '</span>' +
        '<span><span class="suggestion-chip suggestion-' + member.suggestionClass + '">' + member.suggestion + '</span></span>' +
        renderMemberExtra(member, "d-cell-text") +
        '<button type="button" class="member-more-button d-member-more" title="单个对象操作">⋯</button></div>';
    }).join("");
    var detailBlock = "";
    if (group.detailKey) {
      var open = group.detailOpen;
      detailBlock = renderDetailToggle(group, "d-detail-toggle", open) +
        '<div class="issue-detail' + (open ? "" : " collapsed") + '" data-detail="' + group.anchor + '">' +
        renderDetail(group.detailKey, "d-detail-content") + '</div>';
    }
    var expanded = groupIndex < 2;
    return '<div class="d-group' + (expanded ? " expanded" : "") + '" id="d-group-' + group.anchor + '">' +
      '<div class="d-group-header-card" data-group-toggle>' +
        renderRelationBadge(group) +
        '<div class="d-group-title">' + group.title + '</div>' +
        renderResolutionBadge(group) + renderRecommendTag(group, "d-recommend-tag") +
        '<span class="d-header-spacer"></span>' +
        '<span class="d-group-meta">' + group.meta + '</span>' +
        renderConfidenceDonut(group) +
        '<span class="d-group-caret">' + iconUse("icon-chevron-right") + '</span></div>' +
      '<div class="d-group-body">' + memberHeader + members + detailBlock + '</div></div>';
  }).join("");

  return '<header class="d-topbar">' +
      '<div class="d-brand"><div class="d-brand-mark"><svg><use href="#icon-brand-flower"/></svg></div>' +
        '<div class="d-brand-name">Helichrysum <em>蜡菊</em></div></div>' +
      '<div class="d-env-cluster">' +
        '<span class="d-env-chip" title="' + SNAPSHOT_TOOLTIP + '">' + iconUse("icon-clock") + '快照年龄 <b>2 周</b></span>' +
        '<span class="d-env-chip">' + iconUse("icon-database") + 'manifest <b>manifest-2026-08-01</b></span>' +
        '<span class="d-env-chip">' + iconUse("icon-hard-drive") + 'Scope 根路径 <b>4 个</b></span></div>' +
      '<div class="d-topbar-actions">' +
        '<button type="button" class="d-button">' + iconUse("icon-refresh") + '重新扫描</button>' +
        '<button type="button" class="d-button d-button-primary">' + iconUse("icon-clipboard") + '生成处理计划</button></div></header>' +
    '<div class="d-kpi-strip">' + kpiCards + '</div>' +
    '<div class="d-body">' + filterPanel +
      '<main class="d-main">' +
        '<div class="d-main-header"><div><h1 class="d-main-title">问题列表</h1>' +
          '<p class="d-main-subtitle">' + VIEW_SUBTITLE + '</p></div></div>' +
        '<div class="d-batch-bar"><span class="d-selected-count">已选 ' + BATCH_SELECTED_COUNT + ' 个对象</span>' +
          renderBatchButtons("d-batch-button") + '<span class="d-batch-note">' + BATCH_NOTE + '</span></div>' +
        '<div class="d-group-list">' + groups + '</div>' +
      '</main></div>';
}

/* ============================================================
   交互绑定与初始化
   ============================================================ */
var RENDERERS = { a: renderDirectionA, b: renderDirectionB, c: renderDirectionC, d: renderDirectionD };
var renderedStages = {};

function renderStage(directionKey) {
  if (renderedStages[directionKey]) return;
  var stage = document.getElementById("stage-" + directionKey);
  stage.innerHTML = RENDERERS[directionKey]();
  renderedStages[directionKey] = true;
}

function switchDirection(directionKey) {
  renderStage(directionKey);
  document.querySelectorAll(".direction-stage").forEach(function (stage) { stage.classList.remove("active"); });
  document.getElementById("stage-" + directionKey).classList.add("active");
  document.querySelectorAll(".switcher-button").forEach(function (button) {
    button.classList.toggle("active", button.dataset.direction === directionKey);
  });
  window.scrollTo({ top: 0 });
}

document.getElementById("switcher-buttons").addEventListener("click", function (event) {
  var button = event.target.closest(".switcher-button");
  if (button) switchDirection(button.dataset.direction);
});

/* 全局事件代理：下钻展开 / 组展开 / 面板折叠 */
document.addEventListener("click", function (event) {
  /* 下钻详情开关（A / B / C / D 共用） */
  var detailToggle = event.target.closest("[data-detail-toggle]");
  if (detailToggle) {
    var anchor = detailToggle.dataset.detailToggle;
    var stage = detailToggle.closest(".direction-stage");
    var detailBlock = stage.querySelector('[data-detail="' + anchor + '"]');
    var detailRow = stage.querySelector('[data-detail-row="' + anchor + '"]');
    var caret = detailToggle.querySelector(".toggle-caret");
    var label = detailToggle.querySelector(".toggle-label");
    var isOpen = detailBlock ? !detailBlock.classList.contains("collapsed") : !(detailRow && detailRow.classList.contains("c-member-hidden"));
    if (detailBlock) detailBlock.classList.toggle("collapsed", isOpen);
    if (detailRow) detailRow.classList.toggle("c-member-hidden", isOpen);
    if (caret) caret.classList.toggle("rotated", !isOpen);
    if (label) label.textContent = isOpen ? detailToggle.dataset.closedLabel : detailToggle.dataset.openLabel;
    return;
  }

  /* 方向 A / D：点击组头展开/收起成员列表 */
  var groupToggle = event.target.closest("[data-group-toggle]");
  if (groupToggle) {
    var groupElement = groupToggle.closest(".a-group, .d-group");
    if (groupElement) groupElement.classList.toggle("expanded");
    return;
  }

  /* 方向 C：点击组行展开/收起成员行 */
  var groupRow = event.target.closest(".c-group-row");
  if (groupRow) {
    var memberBody = groupRow.closest(".c-group-members");
    var willExpand = !memberBody.classList.contains("expanded");
    memberBody.classList.toggle("expanded", willExpand);
    groupRow.classList.toggle("expanded", willExpand);
    memberBody.querySelectorAll(".c-member-row, .c-detail-block-row").forEach(function (row) {
      if (row.hasAttribute("data-detail-row")) {
        var detailAnchor = row.getAttribute("data-detail-row");
        var toggle = memberBody.querySelector('[data-detail-toggle="' + detailAnchor + '"]');
        var detailOpen = toggle && toggle.querySelector(".toggle-caret").classList.contains("rotated");
        row.classList.toggle("c-member-hidden", !(willExpand && detailOpen));
      } else {
        row.classList.toggle("c-member-hidden", !willExpand);
      }
    });
    return;
  }

  /* 方向 B：筛选面板滑出 / 收起 */
  var filterToggle = event.target.closest("#b-filter-toggle");
  if (filterToggle) {
    filterToggle.classList.toggle("open");
    document.getElementById("b-filter-panel").classList.toggle("open");
    return;
  }

  /* 方向 D：筛选面板折叠 / 展开 */
  var filterHead = event.target.closest("#d-filter-head");
  if (filterHead) {
    document.getElementById("d-filter-panel").classList.toggle("collapsed");
    return;
  }
});

/* 快捷筛选 chip 单选互斥（演示级） */
document.addEventListener("click", function (event) {
  var chip = event.target.closest(".a-quick-chip, .b-chip, .c-chip, .d-chip");
  if (!chip) return;
  var siblings = chip.parentElement.querySelectorAll("." + chip.classList[0]);
  siblings.forEach(function (sibling) { sibling.classList.remove("selected"); });
  chip.classList.add("selected");
});

/* 类型导航点击滚动定位到对应组 */
document.addEventListener("click", function (event) {
  var navItem = event.target.closest(".a-type-item, .d-type-item");
  if (!navItem) return;
  var siblings = navItem.parentElement.querySelectorAll(".a-type-item, .d-type-item");
  siblings.forEach(function (sibling) { sibling.classList.remove("active"); });
  navItem.classList.add("active");
});

/* 初始化：渲染方向 A */
renderStage("a");
</script>
