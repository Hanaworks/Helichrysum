<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helichrysum · 个人数字资产整理与归档工具</title>
  <meta name="description" content="Helichrysum 文档站 - 需求规格说明书 / 技术实现方案 / 实施计划">
  <link rel="icon" type="image/svg+xml" href="_media/logo.svg">

  <!-- 本地主题（无 CDN 依赖，可离线访问） -->
  <link rel="stylesheet" href="vendor/buble.min.css">

  <style>
    :root {
      --theme-color: #b8860b;  /* dark goldenrod, 呼应 helichrysum 蜡菊 */
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .app-name-link { font-weight: 600; }
    /* 表格更紧凑 */
    table { display: block; overflow-x: auto; max-width: 100%; }
    /* 代码块更舒服 */
    pre { font-size: 0.85em; }
    pre code { background: transparent; }
    /* "必须 / 应当 / 可以" 等关键词高亮 */
    strong { color: var(--theme-color); }
    /* sidebar 顶部留白 */
    .sidebar { padding-top: 16px; }
    /* 封面 */
    .cover-main > h1 { color: var(--theme-color); }
    .cover-main blockquote { border-left-color: var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    // 版本号：由发布脚本自动注入 git commit hash（见 scripts/docs-release.sh）
    // 文档每次提交后 hash 变化 → docsify 请求带新参数 → CDN/浏览器强制拉新
    var DOC_VERSION = 'febb5591b978';

    window.$docsify = {
      name: 'Helichrysum',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      maxLevel: 4,
      subMaxLevel: 4,
      search: {
        placeholder: '搜索文档',
        noData: '没有匹配结果',
        depth: 3,
      },
      auto2top: true,
      relativePath: false,
      themeColor: '#b8860b',
      // 所有 .md 请求（含 _sidebar.md）追加版本号，绕过 CDN/浏览器缓存
      alias: {
        '/.*\\.md$': function (path) {
          return path + '?v=' + DOC_VERSION;
        }
      }
    };
  </script>

  <!-- 全部本地资源：不依赖任何外部 CDN -->
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/emoji.min.js"></script>
  <script src="vendor/zoom-image.min.js"></script>
  <!-- prism 语法高亮 -->
  <script src="vendor/prism-rust.min.js"></script>
  <script src="vendor/prism-sql.min.js"></script>
  <script src="vendor/prism-bash.min.js"></script>
  <script src="vendor/prism-json.min.js"></script>
  <script src="vendor/prism-yaml.min.js"></script>
  <script src="vendor/prism-toml.min.js"></script>
</body>
</html>
